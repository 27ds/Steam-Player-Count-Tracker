services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    working_dir: /app
    command: python
    environment:
        DATABASE_URL: postgresql://postgres:{POSTGRES_PASSWORD}@db:5432/mydb
    depends_on:
      - db
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: mydb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data: