name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build CI image
        run: docker build --target ci -t backend-ci ./backend

      - name: Save image as tar
        run: |
          mkdir -p /tmp/docker-images
          docker save backend-ci | gzip > /tmp/docker-images/ci-image.tar.gz

      - name: Upload image tar
        uses: actions/upload-artifact@v7
        with:
          name: backend-ci-image
          path: /tmp/docker-images/ci-image.tar.gz
          retention-days: 1

  Format:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout

        with:
          ref: ${{ github.ref }}

      - name: Download image tar
        uses: actions/download-artifact@v7
        with:
          name: backend-ci-image
          path: /tmp/docker-images

      - name: Load image
        run: gunzip -c /tmp/docker-images/ci-image.tar.gz | docker load

      - name: Format
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/app" -w /app backend-ci ruff format src tests

      - name: Auto-commit formatted code
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format with ruff"

  Linting:
    runs-on: ubuntu-latest
    needs: Format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download image tar
        uses: actions/download-artifact@v7
        with:
          name: backend-ci-image
          path: /tmp/docker-images

      - name: Load image
        run: gunzip -c /tmp/docker-images/ci-image.tar.gz | docker load

      - name: Lint backend
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/app" -w /app backend-ci ruff check src tests

  Typecheck:
    runs-on: ubuntu-latest
    needs: Format
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download image tar
        uses: actions/download-artifact@v7
        with:
          name: backend-ci-image
          path: /tmp/docker-images

      - name: Load image
        run: gunzip -c /tmp/docker-images/ci-image.tar.gz | docker load

      - name: Typecheck backend
        run: |
          docker run --rm -v "${{ github.workspace }}/backend:/app" -w /app backend-ci pyrefly check src tests

  Unittests:
    runs-on: ubuntu-latest
    needs: [Linting, Typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download image tar
        uses: actions/download-artifact@v7
        with:
          name: backend-ci-image
          path: /tmp/docker-images

      - name: Load image
        run: gunzip -c /tmp/docker-images/ci-image.tar.gz | docker load

      - name: Unittest - steam_client
        run: |
          docker run --rm -e PYTHONPATH=src -v "${{ github.workspace }}/backend:/app" -w /app backend-ci pytest tests/test_steam_client.py

      - name: Unittest - db_client
        run: |
          docker run --rm -e PYTHONPATH=src -v "${{ github.workspace }}/backend:/app" -w /app backend-ci pytest tests/test_db_client.py
