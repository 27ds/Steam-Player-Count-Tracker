name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format backend
        run: make backend-format
        
      - name: Commit formatting
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format with ruff"

      - name: Lint backend
        run: make backend-lint

      - name: Typecheck backend
        run: make backend-typecheck

