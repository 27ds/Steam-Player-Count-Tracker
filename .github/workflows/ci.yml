name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:

  Format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format backend
        run: make backend-format

      - name: Commit formatting
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format with ruff"

  Linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
    
      - name: Lint backend
        run: make backend-lint

  Typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Typecheck backend
        run: make backend-typecheck

  Unittests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unittest - steam_client
        run: backend-unittest-steam_client

      - name: Unittest - db_client
        run: backend-unittest-db_client