name: Markdown Pipeline

on:
  push:
    branches: ["**"]
    paths:
      - "**.md"


jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            **/*.md
            #**/node_modules
            #**/.github/pull_request_template.md
            #**/.github/ISSUE_TEMPLATE/**
            #**/docs/drafts/*.md

  Link-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "**/*.md"

  Spell-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Spell check
        uses: streetsidesoftware/cspell-action@v7
        with:
          files: "**/*.md"
          incremental_files_only: false
          arguments: --config tools/markdown/cspell.json
