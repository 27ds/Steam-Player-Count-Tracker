name: Documentation
description: Add or improve documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing or needs to be changed?
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: Affected files
      placeholder: README.md, docs/architecture.md
    validations:
      required: false